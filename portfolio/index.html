<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        SIMON MWANGI NDUA| AI Governance & Risk Management
    </title>

    <meta
        name="description"
        content="AI Governance & Risk Management portfolio of Michael Ngigi."
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         Main Application
         ========================================= -->
    <div id="root"></div>


    <!-- =========================================
         Admin Login Modal
         ========================================= -->
    <div
        class="modal fade"
        id="adminLoginModal"
        tabindex="-1"
        aria-labelledby="adminLoginTitle"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-2">
                    <div>
                        <div class="kicker mb-2">ADMIN ACCESS</div>
                        <h5 class="modal-title mb-0" id="adminLoginTitle">
                            Owner Login
                        </h5>
                    </div>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <form id="adminLoginForm">
                    <div class="modal-body pt-0">
                        <div class="mb-3">
                            <label for="adminUsername" class="form-label">Username</label>
                            <input
                                id="adminUsername"
                                type="text"
                                class="form-control"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">Password</label>
                            <input
                                id="adminPassword"
                                type="password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <div id="adminLoginError" class="text-danger small d-none"></div>
                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button
                            type="button"
                            class="btn btn-ghost"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-gold">
                            Login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- =========================================
         Skill Editor Modal
         ========================================= -->
    <div
        class="modal fade"
        id="skillEditorModal"
        tabindex="-1"
        aria-labelledby="skillEditorTitle"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-2">
                    <div>
                        <div class="kicker mb-2">ADMIN PANEL</div>
                        <h5 class="modal-title mb-0" id="skillEditorTitle">
                            Add Skill
                        </h5>
                    </div>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <form id="skillEditorForm">
                    <div class="modal-body pt-0">
                        <div class="mb-3">
                            <label for="skillNameInput" class="form-label">Skill name</label>
                            <input
                                id="skillNameInput"
                                type="text"
                                class="form-control"
                                placeholder="e.g. AI Assurance"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="skillCategoryInput" class="form-label">Category</label>
                            <input
                                id="skillCategoryInput"
                                type="text"
                                class="form-control"
                                value="AI Governance"
                                placeholder="AI Governance"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="skillPercentInput" class="form-label">Proficiency (%)</label>
                            <input
                                id="skillPercentInput"
                                type="number"
                                min="1"
                                max="100"
                                value="60"
                                class="form-control"
                                required
                            >
                        </div>
                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button
                            type="button"
                            class="btn btn-ghost"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-gold">
                            Save Skill
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- =========================================
         Project Details Modal
         ========================================= -->
    <div
        class="modal fade"
        id="pm"
        tabindex="-1"
        aria-labelledby="projectModalTitle"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-lg modal-dialog-scrollable">

            <div class="modal-content">

                <div
                    class="modal-body"
                    id="pmBody"
                ></div>

            </div>

        </div>
    </div>


    <!-- =========================================
         Owner / Admin Toolbar
         Visible only after owner login
         ========================================= -->
    <div
        id="bar"
        class="d-none"
        role="toolbar"
        aria-label="Owner controls"
    >

        <!-- Edit Mode -->
        <label class="form-check form-switch m-0">

            <input
                class="form-check-input"
                type="checkbox"
                id="tEdit"
                checked
            >

            <span class="ms-1">
                Edit mode
            </span>

        </label>


        <!-- Accent Colour -->
        <input
            type="color"
            id="tColor"
            title="Accent colour"
            aria-label="Change accent colour"
        >

        <button
            type="button"
            id="themeToggle"
            aria-label="Toggle theme"
        >
            Switch to light mode
        </button>


        <!-- SEO -->
        <button
            type="button"
            data-t="seo"
        >
            SEO
        </button>


        <!-- Password -->
        <button
            type="button"
            data-t="pass"
        >
            Password
        </button>


        <!-- Export -->
        <button
            type="button"
            data-t="export"
        >
            Export
        </button>


        <!-- Import -->
        <button
            type="button"
            data-t="import"
        >
            Import
        </button>


        <!-- Reset -->
        <button
            type="button"
            data-t="reset"
        >
            Reset
        </button>


        <!-- Logout -->
        <button
            type="button"
            data-t="out"
        >
            Logout
        </button>

    </div>


    <!-- =========================================
         Hidden File Inputs
         ========================================= -->

    <!-- Image Upload -->
    <input
        type="file"
        id="fImg"
        accept="image/*"
        hidden
    >


    <!-- JSON Import -->
    <input
        type="file"
        id="fJson"
        accept=".json"
        hidden
    >


    <!-- =========================================
         JavaScript
         ========================================= -->

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Application JavaScript -->
    <script src="script.js"></script>

</body>
</html>
